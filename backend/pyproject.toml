[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signspeak-ai"
version = "1.0.0"
description = "Real-Time Indian Sign Language to Text and Speech Translator Using Computer Vision"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.14,<0.11",
    "numpy>=1.24.0",
    "scikit-learn==1.6.1",
    "joblib>=1.3.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "eval-type-backport>=0.2.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.28.0",
    "ruff>=0.1.0",
    "black>=23.10.0",
    "isort>=5.12.0",
    "mypy>=1.6.0",
    "types-requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=app --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/main.py",
    "app/config.py",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
extend-ignore = ["B008", "BLE001", "S110"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
